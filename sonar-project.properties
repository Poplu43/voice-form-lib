# SonarQube / SonarCloud configuration for voice-form-filling
# Run `npm run test:coverage` to regenerate `coverage/lcov.info` before scanning.

sonar.projectKey=myscheme_voice-form-filling
sonar.projectName=voice-form-filling
sonar.projectVersion=0.1.11

# Sources & language
sonar.sources=src
sonar.tests=tests
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript-specific paths
sonar.typescript.tsconfigPath=tsconfig.json

# JavaScript/TypeScript coverage: SonarQube reads lcov.info produced by Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclude generated artifacts, demo apps, and ambient declarations from analysis
sonar.exclusions=dist/**,demo/**,demo-umang-second/**,demo-dist/**,node_modules/**,coverage/**,**/*.d.ts,src/*.backup

# Exclude tests, declaration files, and generated code from coverage.
# VoiceFormService.ts is a 7,255-line speech-recognition/audio-playback
# orchestrator that requires an integration test harness (driving real-time
# SDK callbacks, mutation observers, scroll-driven option loading, recognizer
# event sequences) to cover meaningfully. It is excluded from the unit-test
# coverage metric here — see tests/README.md for a refactor path.
sonar.coverage.exclusions=tests/**,src/**/*.d.ts,src/vite-env.d.ts,src/environment.d.ts,demo/**,demo-umang-second/**,src/VoiceFormService.ts
